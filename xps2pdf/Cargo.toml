[package]
name = "xps2pdf"
description = "StampaCP: converte documenti XPS in PDF mantenendo il testo vettoriale e ricercabile"
edition.workspace = true
version.workspace = true
build = "build.rs"
license.workspace = true

[[bin]]
name = "StampaCP"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
quick-xml = "0.36"
ttf-parser = "0.24"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
base64 = "0.22"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
